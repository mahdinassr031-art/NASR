name: Build Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography pillow pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "TookaTarh_DocManager" app.py

    - name: Compress Output Folder
      shell: powershell
      run: |
        Compress-Archive -Path "dist/TookaTarh_DocManager/*" -DestinationPath "TookaTarh_DocManager.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: TookaTarh_DocManager.zip
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
