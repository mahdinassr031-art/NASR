name: Build Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography pillow pyinstaller

    - name: Create Python Script Dynamically
      shell: powershell
      run: |
        $code = @"
import os, sys, hashlib
from base64 import urlsafe_b64encode
import tkinter as tk
from tkinter import ttk, filedialog, messagebox, simpledialog
from cryptography.fernet import Fernet
from cryptography.hazmat.primitives import hashes
from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

APP_NAME = "CompanyDocs_TookaTarh"
BASE_DATA_DIR = os.path.join(os.environ.get("LOCALAPPDATA", os.path.expanduser("~")), APP_NAME)
DOCS_DIR = os.path.join(BASE_DATA_DIR, "EncryptedDocs")
CONFIG_DIR = os.path.join(BASE_DATA_DIR, "Config")

os.makedirs(DOCS_DIR, exist_ok=True)
os.makedirs(CONFIG_DIR, exist_ok=True)

DEFAULT_ADMIN_PASS_HASH = hashlib.sha256("Admin123".encode()).hexdigest()
PASS_FILE = os.path.join(CONFIG_DIR, "admin.hash")

if not os.path.exists(PASS_FILE):
    with open(PASS_FILE, "w") as f:
        f.write(DEFAULT_ADMIN_PASS_HASH)

def get_cipher_key(password: str) -> bytes:
    salt = b'tooka_tarh_secure_salt_2026'
    kdf = PBKDF2HMAC(
        algorithm=hashes.SHA256(),
        length=32,
        salt=salt,
        iterations=100000,
    )
    return urlsafe_b64encode(kdf.derive(password.encode()))

def verify_admin_password(password: str) -> bool:
    with open(PASS_FILE, "r") as f:
        stored_hash = f.read().strip()
    return hashlib.sha256(password.encode()).hexdigest() == stored_hash

class TookaTarhApp(tk.Tk):
    def __init__(self):
        super().__init__()
        self.title("سامانه مدیریت اسناد و مدارک - توکا طرح")
        self.geometry("800x600")
        self.configure(bg="#f4f6f9")
        self.setup_ui()

    def setup_ui(self):
        header_frame = tk.Frame(self, bg="#1e293b", height=80)
        header_frame.pack(fill=tk.X)
        
        title_label = tk.Label(
            header_frame, 
            text="مدیریت امن مدارک شرکت توکا طرح", 
            font=("Tahoma", 16, "bold"), 
            fg="white", 
            bg="#1e293b"
        )
        title_label.pack(py=20)

        btn_frame = tk.Frame(self, bg="#f4f6f9")
        btn_frame.pack(fill=tk.X, padx=20, pady=15)

        tk.Button(
            btn_frame, text="➕ افزودن مدرک جدید (ادمین)", font=("Tahoma", 10, "bold"),
            bg="#22c55e", fg="white", relief=tk.FLAT, padx=15, pady=8,
            command=self.add_document
        ).pack(side=tk.RIGHT, padx=5)

        tk.Button(
            btn_frame, text="❌ حذف مدرک (ادمین)", font=("Tahoma", 10, "bold"),
            bg="#ef4444", fg="white", relief=tk.FLAT, padx=15, pady=8,
            command=self.delete_document
        ).pack(side=tk.RIGHT, padx=5)

        tk.Button(
            btn_frame, text="📂 باز کردن محل ذخیره‌سازی", font=("Tahoma", 10),
            bg="#0284c7", fg="white", relief=tk.FLAT, padx=15, pady=8,
            command=self.open_file_location
        ).pack(side=tk.LEFT, padx=5)

        list_frame = tk.Frame(self, bg="#f4f6f9")
        list_frame.pack(fill=tk.BOTH, expand=True, padx=20, pady=10)

        columns = ("filename", "size")
        self.tree = ttk.Treeview(list_frame, columns=columns, show="headings", selectmode="browse")
        self.tree.heading("filename", text="نام مدرک")
        self.tree.heading("size", text="حجم (بایت)")
        self.tree.column("filename", anchor=tk.E, width=500)
        self.tree.column("size", anchor=tk.CENTER, width=150)
        self.tree.pack(fill=tk.BOTH, expand=True)

        self.refresh_doc_list()

    def prompt_admin_password(self):
        pwd = simpledialog.askstring("احراز هویت ادمین", "لطفاً رمز عبور ادمین را وارد کنید:", show='*')
        if not pwd:
            return None, False
        if verify_admin_password(pwd):
            return pwd, True
        else:
            messagebox.showerror("خطا", "رمز عبور ادمین اشتباه است!")
            return None, False

    def refresh_doc_list(self):
        for item in self.tree.get_children():
            self.tree.delete(item)
        for f in os.listdir(DOCS_DIR):
            file_path = os.path.join(DOCS_DIR, f)
            if os.path.isfile(file_path):
                size = os.path.getsize(file_path)
                self.tree.insert("", tk.END, values=(f, size))

    def add_document(self):
        admin_pass, auth = self.prompt_admin_password()
        if not auth:
            return

        file_path = filedialog.askopenfilename(title="انتخاب مدرک جهت اضافه کردن")
        if not file_path:
            return

        file_name = os.path.basename(file_path)
        dest_path = os.path.join(DOCS_DIR, file_name + ".enc")

        try:
            cipher = Fernet(get_cipher_key(admin_pass))
            with open(file_path, "rb") as f_in:
                data = f_in.read()
            encrypted_data = cipher.encrypt(data)
            
            with open(dest_path, "wb") as f_out:
                f_out.write(encrypted_data)

            messagebox.showinfo("موفقیت", f"مدرک '{file_name}' با موفقیت رمزنگاری و ذخیره شد.")
            self.refresh_doc_list()
        except Exception as e:
            messagebox.showerror("خطا در ذخیره‌سازی", str(e))

    def delete_document(self):
        selected_item = self.tree.selection()
        if not selected_item:
            messagebox.showwarning("هشدار", "لطفاً یک مدرک را از لیست انتخاب کنید.")
            return

        _, auth = self.prompt_admin_password()
        if not auth:
            return

        item_values = self.tree.item(selected_item, "values")
        file_name = item_values[0]
        file_path = os.path.join(DOCS_DIR, file_name)

        if messagebox.askyesno("تایید حذف", f"آیا از حذف مدرک '{file_name}' اطمینان دارید؟"):
            try:
                os.remove(file_path)
                messagebox.showinfo("حذف شد", "مدرک با موفقیت حذف گردید.")
                self.refresh_doc_list()
            except Exception as e:
                messagebox.showerror("خطا", str(e))

    def open_file_location(self):
        _, auth = self.prompt_admin_password()
        if auth:
            os.startfile(DOCS_DIR)

if __name__ == "__main__":
    app = TookaTarhApp()
    app.mainloop()
"@
        Set-Content -Path "main_app.py" -Value $code -Encoding UTF8

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "TookaTarh_DocManager" main_app.py

    - name: Compress Output Folder
      shell: powershell
      run: |
        Compress-Archive -Path "dist/TookaTarh_DocManager/*" -DestinationPath "TookaTarh_DocManager.zip"

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TookaTarh_Executable_Program
        path: TookaTarh_DocManager.zip
