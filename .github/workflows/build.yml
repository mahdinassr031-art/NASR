name: Build Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography pillow pyinstaller

    - name: Create Branding Directory if Missing
      run: |
        mkdir Branding -ErrorAction SilentlyContinue
        # ایجاد یک آیکون خالی در صورت عدم وجود جهت جلوگیری از خطای Build
        if (!(Test-Path "Branding/tooka_program_icon.ico")) {
            New-Item -Path "Branding/tooka_program_icon.ico" -ItemType "file" -Force
        }

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "TookaTarh_DocManager" app.py

    - name: Compress Output Folder
      run: |
        Compress-Archive -Path "dist/TookaTarh_DocManager/*" -DestinationPath "TookaTarh_DocManager.zip"

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v3
      with:
        name: TookaTarh_Executable_Program
        path: TookaTarh_DocManager.zip
